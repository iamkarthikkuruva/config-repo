server:
  port: 9094

spring:
  # MongoDB Datasource configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/orderdb

  # Spring Boot Admin Client configuration
#  boot:
#    admin:
#      client:
#        url: http://localhost:9999

# Eureka client configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  # InstanceId
  instance:
    instance-id: ${spring.application.name}:${random.value}

# Management endpoints configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"    # Expose all actuator endpoints
  # zipkin server configurations
  tracing:
    sampling:
      probability: 1.0  # 100% tracing sampling
