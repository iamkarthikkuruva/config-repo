server:
  port: 9090

spring:
  # Gateway routes configuration
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: restaurant-service
              uri: lb://restaurant-service  # Load-balanced URI for restaurant-service
              predicates:
                - Path=/restaurant/**
            - id: food-catalogue-service
              uri: lb:food-catalogue-service
              predicates:
                - Path=/foodCatalogue/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/**

# Eureka client configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/  # Eureka server URL for service registration and discovery
  # InstanceId
  instance:
    instance-id: ${spring.application.name}:${random.value}  # Unique instance ID for Eureka registration