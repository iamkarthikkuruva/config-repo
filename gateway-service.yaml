server:
  port: 9090

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0 # 100%

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: restaurant-service
              uri: lb://restaurant-service
              predicates:
                - Path=/restaurant/**
            - id: food-catalogue-service
              uri: lb://food-catalogue-service
              predicates:
                - Path=/foodCatalogue/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/**